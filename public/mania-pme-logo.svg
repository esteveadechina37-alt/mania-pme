<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6200;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C42;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle -->
  <circle cx="64" cy="64" r="62" fill="url(#logoGradient)"/>
  
  <!-- Inner white circle -->
  <circle cx="64" cy="64" r="58" fill="#0A0A0A"/>
  
  <!-- M Letter (stylized) - Left part -->
  <g fill="#FF6200">
    <!-- Left vertical line -->
    <rect x="28" y="36" width="6" height="56" rx="3"/>
    
    <!-- Right vertical line -->
    <rect x="66" y="36" width="6" height="56" rx="3"/>
    
    <!-- Peak - left diagonal -->
    <path d="M 34 36 L 47 52 L 43 52 L 30 36" fill="#FF6200"/>
    
    <!-- Peak - right diagonal -->
    <path d="M 72 36 L 59 52 L 63 52 L 76 36" fill="#FF6200"/>
    
    <!-- Center peak -->
    <rect x="46" y="36" width="6" height="20" rx="3"/>
  </g>
  
  <!-- Curved accent (PME representation) -->
  <g stroke="#FF8C42" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Curved lines representing organization/structure -->
    <path d="M 28 68 Q 64 72 100 68"/>
    <path d="M 30 80 Q 64 84 98 80"/>
    <path d="M 35 92 Q 64 96 93 92"/>
  </g>
</svg>